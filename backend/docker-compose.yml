services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: diploma
      POSTGRES_PASSWORD: diploma
      POSTGRES_DB: diploma
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diploma"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://diploma:diploma@db:5432/diploma
      SECRET_KEY: test-secret-key-for-dev
      PINATA_API_KEY: ""
      PINATA_SECRET_KEY: ""
      CONTRACT_ADDRESS: ""
      WALLET_PRIVATE_KEY: ""
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic revision --autogenerate -m init 2>/dev/null;
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
